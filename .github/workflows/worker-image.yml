name: Build worker image

# Builds the RunPod serverless worker image and pushes it to GHCR. There is no
# Docker on the Windows dev machine, so the image is built here. Models are NOT
# in the image (they live on a RunPod Network Volume), but torch + CUDA make it
# ~9-11GB, so we free up runner disk first.
on:
  push:
    paths:
      - "worker/**"
      - "training/*.py"
      - "training/*.json"
      - "comfyui-requirements.lock.txt"
      - "comfyui-requirements-extra.lock.txt"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-worker" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed ${{ steps.img.outputs.name }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Point the RunPod endpoint at the :${{ github.sha }} tag (keep the GHCR package private + add a registry credential in RunPod)." >> "$GITHUB_STEP_SUMMARY"
